<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compact Vertical Flow</title>
<style>
    body {
        margin: 0;
        background: #f4f6f8;
        font-family: Arial, sans-serif;
    }

    .wrapper {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .diagram {
        transform: scale(0.85); /* shrink entire diagram */
        transform-origin: top center;
    }

    .row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin: 8px 0;
    }

    .box {
        background: #fff;
        border: 1.5px solid #2c3e50;
        border-radius: 6px;
        padding: 8px;
        width: 140px;
        text-align: center;
        font-size: 11px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    .exchange {
        background: #e8f4ff;
        border: 1.5px dashed #2980b9;
        width: 220px;
    }

    .arrow {
        text-align: center;
        font-size: 14px;
        margin: 2px 0;
    }

    .label {
        font-size: 9px;
        color: #555;
    }

</style>
</head>
<body>

<div class="wrapper">
<div class="diagram">

    <!-- Auth -->
    <div class="row">
        <div class="box">
            <strong>Auth Service</strong><br>
            User Registers
        </div>
    </div>

    <div class="arrow">↓<div class="label">UserRegisteredEvent</div></div>

    <!-- Exchange -->
    <div class="row">
        <div class="box exchange">
            user.events Exchange<br>(Topic)
        </div>
    </div>

    <div class="arrow">↓</div>

    <!-- Parallel -->
    <div class="row">
        <div class="box">
            User Service<br>Creates Profile
        </div>

        <div class="box">
            Wallet Service<br>Creates Wallet
        </div>
    </div>

    <!-- Transaction -->
    <div class="row">
        <div class="box">
            Transaction Service<br>Done
        </div>
    </div>

    <div class="arrow">↓<div class="label">TransactionCompletedEvent</div></div>

    <!-- Exchange -->
    <div class="row">
        <div class="box exchange">
            transaction.events<br>(Topic)
        </div>
    </div>

    <div class="arrow">↓</div>

    <!-- Notification -->
    <div class="row">
        <div class="box">
            Notification Service<br>(Future)<br>SMS / Email
        </div>
    </div>

</div>
</div>

</body>
</html>
