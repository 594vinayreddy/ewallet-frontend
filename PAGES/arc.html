<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banking Microservices Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f0ede8;
    background-image:
      radial-gradient(circle, #c8c4be 1px, transparent 1px);
    background-size: 22px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 28px 20px 40px;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .page-title {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #666;
    letter-spacing: 0.04em;
    margin-bottom: 18px;
    text-transform: uppercase;
    align-self: flex-start;
    margin-left: 12px;
  }

  .board {
    background: white;
    border: 1.5px solid #d8d4cf;
    border-radius: 10px;
    padding: 32px 36px 28px;
    width: 980px;
    max-width: 100%;
    box-shadow: 0 6px 28px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.06);
    position: relative;
  }

  .board-label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: #555;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .board-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e8e4df;
  }

  svg {
    width: 100%;
    overflow: visible;
  }
</style>
</head>
<body>

<div class="page-title">Spring Boot Microservices · Banking System · Architecture Overview</div>

<div class="board">
