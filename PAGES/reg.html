<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — RupeePay</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --c1: #4b3e73;
    --c2: #877cbc;
    --c3: #0f034b;
    --c4: #786ac0;
    --c5: #22162f;
    --c6: #c5bedb;
    --c7: #827394;
    --c8: #a99fd0;
    --c9: #5d5667;
  }

  body {
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, var(--c5) 0%, var(--c3) 40%, var(--c1) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Flying notes ── */
  .notes-bg {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .note {
    position: absolute;
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.3);
    animation: fly linear infinite;
    overflow: hidden;
    transform-style: preserve-3d;
  }

  .note img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 8px;
  }

  .note-500 { width: 200px; height: 90px; }
  .note-100 { width: 185px; height: 83px; }

  @keyframes fly {
    0%   { transform: translateY(110vh) rotate(var(--r0)) translateX(0);        opacity: 0;    }
    6%   { opacity: 0.88; }
    80%  { transform: translateY(5vh)   rotate(var(--r1)) translateX(var(--dx)); opacity: 0.88; }
    95%  { transform: translateY(-5vh)  rotate(var(--r1)) translateX(var(--dx)); opacity: 0;    }
    100% { transform: translateY(-10vh) rotate(var(--r1)) translateX(var(--dx)); opacity: 0;    }
  }

  /* ── Orbs ── */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.4;
    pointer-events: none;
    z-index: 1;
  }
  .orb-1 { width: 500px; height: 500px; background: var(--c1); top: -120px; left: -150px; }
  .orb-2 { width: 400px; height: 400px; background: var(--c3); bottom: -80px; right: -100px; }
  .orb-3 { width: 300px; height: 300px; background: var(--c4); bottom: 25%; left: 15%; opacity: 0.25; }

  /* ── Glass card ── */
  .card-wrap {
    position: relative; z-index: 10;
    width: min(480px, 94vw);
  }

  .brand {
    text-align: center;
    margin-bottom: 28px;
  }
  .brand h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 900;
    color: #fff;
    letter-spacing: -1px;
  }
  .brand h1 span { color: var(--c6); }
  .brand p {
    margin-top: 4px;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.45);
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  .glass {
    background: rgba(15, 3, 75, 0.25);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(197, 190, 219, 0.22);
    border-radius: 24px;
    padding: 40px 36px 36px;
    box-shadow:
      0 8px 40px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(197,190,219,0.25),
      inset 0 -1px 0 rgba(0,0,0,0.15);
  }

  /* shine line */
  .glass::before {
    content: '';
    display: block;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(197,190,219,0.5), transparent);
    margin: -40px -36px 36px;
    border-radius: 24px 24px 0 0;
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 0.70rem;
    font-weight: 500;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--c6);
    opacity: 0.75;
    margin-bottom: 7px;
  }

  .field input {
    width: 100%;
    background: rgba(135, 124, 188, 0.12);
    border: 1px solid rgba(197, 190, 219, 0.18);
    border-radius: 12px;
    padding: 12px 16px;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    outline: none;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
  }
  .field input::placeholder { color: rgba(197,190,219,0.3); }
  .field input:focus {
    border-color: var(--c8);
    background: rgba(120, 106, 192, 0.2);
    box-shadow: 0 0 0 3px rgba(169, 159, 208, 0.2);
  }

  .field input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1) opacity(0.45);
    cursor: pointer;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--c1) 0%, var(--c4) 60%, var(--c2) 100%);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    margin-top: 6px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 24px rgba(75, 62, 115, 0.6);
  }
  .submit-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 100%);
    pointer-events: none;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(120, 106, 192, 0.65); }
  .submit-btn:active { transform: translateY(0); }

  .footer-text {
    text-align: center;
    margin-top: 20px;
    font-size: 0.8rem;
    color: rgba(197,190,219,0.4);
  }
  .footer-text a { color: var(--c8); text-decoration: none; }

  @media (max-width: 480px) {
    .row { grid-template-columns: 1fr; gap: 0; }
    .glass { padding: 32px 22px 28px; }
  }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="notes-bg" id="notesBg"></div>

<div class="card-wrap">
  <div class="brand">
    <h1>Rupee<span>Pay</span></h1>
    <p>Open your account</p>
  </div>

  <div class="glass">
    <form onsubmit="handleSubmit(event)">
      <div class="row">
        <div class="field">
          <label>First Name</label>
          <input type="text" name="firstName" placeholder="Ravi" required>
        </div>
        <div class="field">
          <label>Last Name</label>
          <input type="text" name="lastName" placeholder="Sharma" required>
        </div>
      </div>

      <div class="field">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="ravi@example.com" required>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min. 8 characters" minlength="8" required>
      </div>

      <div class="row">
        <div class="field">
          <label>Phone Number</label>
          <input type="tel" name="phoneNumber" placeholder="9876543210" pattern="[0-9]{10,13}" required>
        </div>
        <div class="field">
          <label>Date of Birth</label>
          <input type="date" name="dateOfBirth" required>
        </div>
      </div>

      <button type="submit" class="submit-btn">Create Account →</button>
    </form>

    <p class="footer-text">Already have an account? <a href="#">Sign in</a></p>
  </div>
</div>

    const r0 = (Math.random() * 60 - 30).toFixed(1);
    const r1 = (Math.random() * 60 - 30).toFixed(1);
    const duration = (9 + Math.random() * 14).toFixed(2);
    const delay = -(Math.random() * 20).toFixed(2);
    const scale = (0.55 + Math.random() * 0.75).toFixed(2);

    note.style.cssText = `
      left: ${startX}vw;
      bottom: -130px;
      --r0: ${r0}deg;
      --r1: ${r1}deg;
      --dx: ${dx}px;
      animation-duration: ${duration}s;
      animation-delay: ${delay}s;
      transform: scale(${scale});
    `;

    const img = document.createElement('img');
    img.src = is500 ? NOTE500_SRC : NOTE100_SRC;
    img.alt = is500 ? '₹500' : '₹100';
    note.appendChild(img);
    bg.appendChild(note);
  }

  function handleSubmit(e) {
    e.preventDefault();
    const btn = e.target.querySelector('.submit-btn');
    btn.textContent = '✓ Account Created!';
    btn.style.background = 'linear-gradient(135deg,#2d1f5e,#5d5667)';
    setTimeout(() => {
      btn.textContent = 'Create Account →';
      btn.style.background = '';
      e.target.reset();
    }, 2500);
  }
</script>
</body>
</html>
