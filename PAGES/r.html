<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — RupeePay</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #00a86b;
    --green-light: #00d48a;
    --purple: #6c3fa1;
    --gold: #c9a84c;
    --note-500-bg: #6fba7b;
    --note-100-bg: #8ea9d4;
    --glass-bg: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.25);
    --glass-shadow: rgba(0,0,0,0.35);
  }

  body {
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #0d1b2a 0%, #1a2d1f 40%, #0d1b2a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Flying notes canvas ── */
  .notes-bg {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .note {
    position: absolute;
    border-radius: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    animation: fly linear infinite;
    opacity: 0.82;
    transform-style: preserve-3d;
  }

  /* ₹500 — greenish */
  .note-500 {
    width: 160px; height: 72px;
    background: linear-gradient(120deg, #4caf72 0%, #76c98a 40%, #3d9960 60%, #5dbf7a 100%);
    border: 1.5px solid rgba(255,255,255,0.18);
  }
  .note-500::before {
    content: '₹500';
    position: absolute; top: 6px; right: 10px;
    font-family: 'Playfair Display', serif;
    font-size: 15px; font-weight: 700;
    color: rgba(0,0,0,0.55);
    letter-spacing: 1px;
  }
  .note-500::after {
    content: 'RESERVE BANK OF INDIA';
    position: absolute; top: 6px; left: 8px;
    font-size: 5.5px; letter-spacing: 0.5px;
    color: rgba(0,0,0,0.45);
    font-weight: 500;
  }

  /* ₹100 — lavender/blue */
  .note-100 {
    width: 145px; height: 65px;
    background: linear-gradient(120deg, #7b9fd4 0%, #a0bde8 40%, #6888bf 60%, #8fabda 100%);
    border: 1.5px solid rgba(255,255,255,0.2);
  }
  .note-100::before {
    content: '₹100';
    position: absolute; top: 6px; right: 10px;
    font-family: 'Playfair Display', serif;
    font-size: 14px; font-weight: 700;
    color: rgba(0,0,0,0.50);
    letter-spacing: 1px;
  }
  .note-100::after {
    content: 'RESERVE BANK OF INDIA';
    position: absolute; top: 6px; left: 8px;
    font-size: 5.5px; letter-spacing: 0.5px;
    color: rgba(0,0,0,0.40);
    font-weight: 500;
  }

  /* Gandhi silhouette strip */
  .note .gandhi {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 38px;
    border-radius: 50% 50% 40% 40%;
    background: rgba(0,0,0,0.18);
    clip-path: ellipse(50% 55% at 50% 45%);
  }

  /* Security thread */
  .note .thread {
    position: absolute;
    left: 52px; top: 6px; bottom: 6px;
    width: 2.5px;
    background: rgba(0,0,0,0.22);
    border-radius: 2px;
  }

  /* Denomination watermark */
  .note .watermark {
    position: absolute;
    right: 28px; bottom: 6px;
    font-size: 7px;
    color: rgba(0,0,0,0.30);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  @keyframes fly {
    0%   { transform: translateY(110vh) rotate(var(--r0)) translateX(0);   opacity: 0; }
    8%   { opacity: 0.82; }
    92%  { opacity: 0.82; }
    100% { transform: translateY(-30vh)  rotate(var(--r1)) translateX(var(--dx)); opacity: 0; }
  }

  /* ── Glass card ── */
  .card-wrap {
    position: relative; z-index: 10;
    width: min(480px, 94vw);
  }

  .brand {
    text-align: center;
    margin-bottom: 28px;
  }
  .brand h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 900;
    color: #fff;
    letter-spacing: -1px;
  }
  .brand h1 span { color: var(--green-light); }
  .brand p {
    margin-top: 4px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .glass {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 24px;
    padding: 40px 36px 36px;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.2),
      inset 0 -1px 0 rgba(0,0,0,0.1);
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-bottom: 7px;
  }

  .field input {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 12px 16px;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    outline: none;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
  }
  .field input::placeholder { color: rgba(255,255,255,0.25); }
  .field input:focus {
    border-color: var(--green-light);
    background: rgba(0,212,138,0.08);
    box-shadow: 0 0 0 3px rgba(0,212,138,0.18);
  }

  .field input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1) opacity(0.4);
    cursor: pointer;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--green) 0%, var(--green-light) 100%);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    margin-top: 6px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 20px rgba(0,168,107,0.45);
  }
  .submit-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 100%);
    pointer-events: none;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,168,107,0.55); }
  .submit-btn:active { transform: translateY(0); }

  .footer-text {
    text-align: center;
    margin-top: 20px;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.35);
  }
  .footer-text a { color: var(--green-light); text-decoration: none; }

  /* Shine line at top of glass card */
  .glass::before {
    content: '';
    display: block;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    margin: -40px -36px 36px;
    border-radius: 24px 24px 0 0;
  }

  /* Glowing orbs behind card */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 1;
  }
  .orb-1 { width: 420px; height: 420px; background: #00a86b; top: -80px; left: -120px; }
  .orb-2 { width: 360px; height: 360px; background: #3a5fa0; bottom: -60px; right: -80px; }
  .orb-3 { width: 260px; height: 260px; background: #c9a84c; bottom: 30%; left: 20%; }

  @media (max-width: 480px) {
    .row { grid-template-columns: 1fr; gap: 0; }
    .glass { padding: 32px 22px 28px; }
  }
</style>
</head>
<body>

<!-- Ambient orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Flying notes -->
<div class="notes-bg" id="notesBg"></div>

<!-- Registration Form -->
<div class="card-wrap">
  <div class="brand">
    <h1>Rupee<span>Pay</span></h1>
    <p>Open your account</p>
  </div>

  <div class="glass">
    <form onsubmit="handleSubmit(event)">
      <div class="row">
        <div class="field">
          <label>First Name</label>
          <input type="text" name="firstName" placeholder="Ravi" required>
        </div>
        <div class="field">
          <label>Last Name</label>
          <input type="text" name="lastName" placeholder="Sharma" required>
        </div>
      </div>

      <div class="field">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="ravi@example.com" required>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min. 8 characters" minlength="8" required>
      </div>

      <div class="row">
        <div class="field">
          <label>Phone Number</label>
          <input type="tel" name="phoneNumber" placeholder="9876543210" pattern="[0-9]{10,13}" required>
        </div>
        <div class="field">
          <label>Date of Birth</label>
          <input type="date" name="dateOfBirth" required>
        </div>
      </div>

      <button type="submit" class="submit-btn">Create Account →</button>
    </form>

    <p class="footer-text">Already have an account? <a href="#">Sign in</a></p>
  </div>
</div>

<script>
  /* ── Generate flying notes ── */
  const bg = document.getElementById('notesBg');
  const noteCount = 22;

  for (let i = 0; i < noteCount; i++) {
    const is500 = Math.random() > 0.45;
    const note = document.createElement('div');
    note.className = `note ${is500 ? 'note-500' : 'note-100'}`;

    const startX = Math.random() * 110 - 5;           // vw %
    const dx = (Math.random() - 0.5) * 220;           // px drift
    const r0 = (Math.random() * 60 - 30).toFixed(1);  // start rotation
    const r1 = (Math.random() * 60 - 30).toFixed(1);  // end rotation
    const duration = (9 + Math.random() * 14).toFixed(2);
    const delay = -(Math.random() * 20).toFixed(2);   // negative = already flying
    const scale = (0.6 + Math.random() * 0.75).toFixed(2);

    note.style.cssText = `
      left: ${startX}vw;
      bottom: -120px;
      --r0: ${r0}deg;
      --r1: ${r1}deg;
      --dx: ${dx}px;
      animation-duration: ${duration}s;
      animation-delay: ${delay}s;
      transform: scale(${scale});
    `;

    // Inner elements
    const gandhi = document.createElement('div');
    gandhi.className = 'gandhi';
    const thread = document.createElement('div');
    thread.className = 'thread';
    const wm = document.createElement('div');
    wm.className = 'watermark';
    wm.textContent = is500 ? '2AR 093517' : '1AP 334788';

    note.appendChild(gandhi);
    note.appendChild(thread);
    note.appendChild(wm);
    bg.appendChild(note);
  }

  /* ── Form submit ── */
  function handleSubmit(e) {
    e.preventDefault();
    const btn = e.target.querySelector('.submit-btn');
    btn.textContent = '✓ Account Created!';
    btn.style.background = 'linear-gradient(135deg,#006644,#00a86b)';
    setTimeout(() => {
      btn.textContent = 'Create Account →';
      btn.style.background = '';
      e.target.reset();
    }, 2500);
  }
</script>
</body>
</html>
